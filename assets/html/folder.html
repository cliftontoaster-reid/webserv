<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory Listing</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="min-h-screen bg-gray-50 p-6">
    <div class="max-w-7xl mx-auto">
      <!-- Header with logo and parent directory link -->
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center space-x-4">
          <a href="https://github.com/cliftontoaster-reid/webserv" target="_blank"
             class="inline-block transition hover:opacity-80">
            <div class="px-4 py-2 border-2 border-blue-600 rounded flex items-center justify-center">
              <span class="font-bold text-blue-600 tracking-wider">WebFloof</span>
              <span class="font-medium text-gray-600 ml-1">OSS</span>
            </div>
          </a>
          <h1 class="text-2xl font-bold text-gray-800">📂 Directory</h1>
        </div>
        <a href="../" class="text-blue-600 hover:underline text-sm flex items-center">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
          Parent directory
        </a>
      </div>

      <!-- Grid container: the placeholder will be replaced -->
      <div id="file-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        {{FILE_GRID}}
      </div>

      <!-- Fallback if grid is empty (can be shown via JS) -->
      <p id="empty-message" class="mt-6 text-gray-500 text-center hidden">No files found.</p>
    </div>
  </div>

  <script>
    // Hide empty message if there are items
    (function() {
      const grid = document.getElementById('file-grid');
      const emptyMsg = document.getElementById('empty-message');
      // If the grid contains only whitespace (no child elements), show empty message
      if (grid.children.length === 0) {
        emptyMsg.classList.remove('hidden');
      }
    })();
  </script>
</body>
</html>
