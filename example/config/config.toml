#:schema ../../docs/config.schema.json

[[server]]
port = 1998

[[server.host]]
hostname = ""

[server.host.error]
404 = "/var/www/html/errors/404.html"

[[server.host.route]]
preffix = "/"
path = "/var/www/html/cgi"
index = "index.php"
methods.POST = true

[[server.host.route]]
preffix = "/upload"
path = "/srv/upload"
index = "index.noway"

[[server.host.route]]
preffix = "/imgs"
path = "/usr"

[[server.host.api]]
uri = "/api/upload"
external = false
func = "upload"
upload = { path = "/srv/upload", random_len = 4 }

[[server.host.cgi]]
glob = "/*.php"
bin = "/usr/bin/php-cgi"
