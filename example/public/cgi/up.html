
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Upload Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-6">

<div class="max-w-3xl mx-auto">
    <!-- Header with back button -->
    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-gray-800">📤 Upload Files</h1>
        <a href="/" class="inline-flex items-center px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg transition">
            <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Back to Gallery
        </a>
    </div>

    <!-- Upload Form -->
    <div class="bg-white rounded-xl shadow-md p-6">
        <form id="uploadForm" enctype="multipart/form-data" method="post" action="/api/upload">
            <!-- File input (multiple) -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Select files to upload
                </label>
                <input type="file" name="file[]" multiple 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                       required />
                <p class="mt-1 text-sm text-gray-500">You can select multiple files at once.</p>
            </div>

            <!-- Submit button -->
            <button type="submit" id="submitBtn"
                    class="w-full flex items-center justify-center px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition shadow-sm">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                </svg>
                Upload Files
            </button>
        </form>

        <!-- Status message area -->
        <div id="status" class="mt-4 hidden"></div>
    </div>

    <!-- Optional: list of uploaded files (if you want to show them) -->
    <div class="mt-6 text-sm text-gray-500">
        <p>Files are stored with random names; a <code>._txt</code> file will be created with the original filename.</p>
    </div>
</div>

<script>
    (function() {
        const form = document.getElementById('uploadForm');
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); // prevent normal submission

            // Show loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-5 w-5 mr-2" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                Uploading...
            `;

            // Build FormData
            const formData = new FormData(form);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                });

                // Try to parse JSON, but handle plain text if not
                let result;
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    result = { message: await response.text() };
                }

                // Reset button
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    Upload Files
                `;

                // Show status
                status.className = 'mt-4 p-3 rounded-lg ' + (response.ok ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-red-50 text-red-700 border border-red-200');
                status.innerHTML = response.ok
                    ? '✅ ' + (result.message || 'Upload successful!')
                    : '❌ ' + (result.message || 'Upload failed.');
                status.classList.remove('hidden');

                // Optionally clear the file input on success
                if (response.ok) {
                    form.reset();
                    // Redirect to gallery after a short delay? Uncomment if desired:
                    // setTimeout(() => { window.location.href = '/'; }, 2000);
                }

            } catch (error) {
                // Network error
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                    </svg>
                    Upload Files
                `;
                status.className = 'mt-4 p-3 rounded-lg bg-red-50 text-red-700 border border-red-200';
                status.innerHTML = '❌ Network error – please try again.';
                status.classList.remove('hidden');
            }
        });
    })();
</script>

</body>
</html>
